name: Windows Engine APK

on:
  push:
    branches: [arena/3fb7149b-app]
    paths:
      - 'windows-engine/**'
      - '.github/workflows/engine-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: Fetch upstream engine source (pinned)
        run: |
          git clone https://github.com/brunodev85/winlator-app.git engine
          git -C engine checkout 8077f374ef2d54127b088de9e8cd7b4af14d9c8b

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK components (NDK 24, CMake 3.22.1)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using SDK at: $SDK"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"; fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/24.0.8215888" >> "$GITHUB_ENV"

      - name: Apply Windows in Mobile branding
        run: bash app/windows-engine/brand.sh engine

      - name: Build release APK
        working-directory: engine
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace assembleRelease > "$GITHUB_WORKSPACE/gradle.log" 2>&1
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            # Surface the real failure as annotations (readable via the GitHub API).
            WHAT=$(grep -A12 "What went wrong" "$GITHUB_WORKSPACE/gradle.log" | head -14 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            TAIL=$(tail -40 "$GITHUB_WORKSPACE/gradle.log" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=What went wrong::$WHAT"
            echo "::error title=Gradle tail::$TAIL"
            exit "$RC"
          fi

      - name: Keep Gradle log
        if: always()
        run: mkdir -p "$GITHUB_WORKSPACE/out" && cp "$GITHUB_WORKSPACE/gradle.log" "$GITHUB_WORKSPACE/out/gradle.log" 2>/dev/null || true

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(ls engine/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" out/Windows-in-Mobile-Engine.apk
          sha256sum out/Windows-in-Mobile-Engine.apk | tee out/SHA256SUMS.txt
          ls -l out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-in-mobile-engine
          path: out/
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="windows-engine-r${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/Windows-in-Mobile-Engine.apk out/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Windows in Mobile Engine (build ${GITHUB_RUN_NUMBER})" \
            --notes "Winlator-based Windows (x86_64) runtime for Android 8+ (arm64). Built from brunodev85/winlator-app@8077f374 with Windows in Mobile branding." \
            --latest
